# Real tokio programs for tests/tokio. Their crates come only from the
# lockfile, which flake.nix vendors; nothing is fetched at build time.
[workspace]
resolver = "3"
members = ["truth", "std-async", "panics", "workers", "server", "drivers", "steps", "cancel"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
truth = { path = "truth" }
tokio = { version = "=1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
libc = "0.2"

[profile.dev]
opt-level = 0
debug = 2

[profile.release]
opt-level = 3
debug = 2

# Panics that abort rather than unwind.
[profile.abort]
inherits = "dev"
panic = "abort"

# Lines and nothing else: no types, so no tasks.
[profile.lines]
inherits = "dev"
debug = "line-tables-only"

# Symbols and nothing else.
[profile.stripped]
inherits = "dev"
strip = "debuginfo"
