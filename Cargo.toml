[package]
name = "uscope"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Linux x86-64 native debugger"
repository = "https://github.com/jcalabro/uscope"
readme = "README.md"
keywords = ["debugger", "dwarf", "linux", "ptrace"]
categories = ["command-line-utilities", "development-tools::debugging"]

[features]
fuzzing = []

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
anyhow = "1.0"
anstyle = "1.0"
anstyle-query = "1.1"
clap = { version = "4.6", features = ["derive"] }
rustyline = "18.0"
rustc_apfloat = "=0.2.3"
thiserror = "2.0"
tokio = { version = "1.52", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gimli = "0.34"
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "instr_info", "std"] }
nix = { version = "0.31", features = ["ptrace", "process", "signal", "uio"] }
object = { version = "0.39", features = ["read"] }

[dev-dependencies]
expectrl = "0.9"

# Debug-info normalization is deliberately CPU-heavy. A small amount of
# optimization keeps the full behavioral matrix fast without the compile cost
# or disabled safety checks of the release profile.
[profile.test]
opt-level = 1
debug = 1
