[package]
name = "uscope"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Linux x86-64 native debugger"
repository = "https://github.com/jcalabro/uscope"
readme = "README.md"
keywords = ["debugger", "dwarf", "linux", "ptrace"]
categories = ["command-line-utilities", "development-tools::debugging"]

[features]
# Fuzz harnesses synthesize object files from structured input.
fuzzing = ["object/write"]
# The deterministic simulator's sweep and replay binary. Its tests run with
# the library's own.
sim = []

[[bin]]
name = "uscope-sim"
path = "src/bin/uscope-sim.rs"
required-features = ["sim"]

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Hash iteration order varies between runs, which would make the same input
# behave differently; clippy.toml bans the iterator methods `for` misses.
iter_over_hash_type = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
anyhow = "1.0"
anstyle = "1.0"
anstyle-query = "1.1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
rustyline = "18.0"
rustc_apfloat = "=0.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
thiserror = "2.0"
wasmi = { version = "2.0", default-features = false, features = ["std", "validate"] }
tokio = { version = "1.52", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpp_demangle = "0.5"
gimli = "0.34"
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "gas", "instr_info", "intel", "std"] }
lzma-rs = "0.3"
nix = { version = "0.31", features = ["fs", "personality", "ptrace", "process", "signal", "term", "uio"] }
object = { version = "0.39", features = ["read"] }
rustc-demangle = "0.1"

[dev-dependencies]
expectrl = "0.9"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
jsonschema = { version = "0.58", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
tokio-tungstenite = "0.29"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
object = { version = "0.39", features = ["read", "write"] }

# Debug-info normalization is deliberately CPU-heavy. A small amount of
# optimization keeps the full behavioral matrix fast without the compile cost
# or disabled safety checks of the release profile.
[profile.test]
opt-level = 1
debug = 1

# Simulation sweeps: optimized, with the debug assertions that keep the
# flight recorder and internal checks on.
[profile.sim]
inherits = "release"
debug-assertions = true
overflow-checks = true

# Generating debuginfo for this crate more than doubles the incremental rebuild
# after an edit. Dependencies keep theirs since they are rarely rebuilt. Pass
# `--config 'profile.test.package.uscope.debug=1'` when stepping through a test.
[profile.test.package.uscope]
debug = 0
